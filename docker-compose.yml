services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: papercrm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:///app/data/crm.db?mode=rwc
      - JWT_SECRET=${JWT_SECRET:-papercrm-handdrawn-supersecret-jwt-key}
      - RUST_LOG=papercrm_backend=info,tower_http=info
    volumes:
      - crm_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papercrm-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_BACKEND_URL=http://backend:8080
      - HOST=0.0.0.0
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  crm_data:
    driver: local

networks:
  crm_network:
    driver: bridge
